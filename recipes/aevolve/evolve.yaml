experiment:
  id: aevolve
  max_generations: 20
  target_score: null
  budget_usd: 150
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: builtin-codex
surface:
  include:
    - target/**
  exclude: []
operators:
  select: {operator: greedy, timeout_s: 600, config: {}}
  rollout: {operator: harbor, timeout_s: 3600, config: {budget_tasks: 10, n_concurrent: 4, agent_setup_timeout_multiplier: 1, max_retries: 1}}
  analyze: {operator: trajectory_only, timeout_s: 3600, config: {history_cycles: 2, max_observations: 30, max_chars: 30000, judge_max_concurrent: 4, judge_retry_attempts: 1, judge_timeout_s: 600}}
  mutate:
    operator: aevolve
    timeout_s: 3600
    config:
      trajectory_only: true
      expose_gate_data: false
      runner: harbor
      agent: codex
      model: gpt-5.4
      environment: docker
      image: evolve-mutate-codex:20260818-codex0146
      agent_kwargs: {reasoning_effort: xhigh}
      editable_roots: [target]
      evolve_prompts: true
      evolve_skills: true
      evolve_memory: false
      prompt_path: target/prompt.md
      skills_dir: target/skills
      memory_dir: target/memory
      history_cycles: 2
      max_observations: 30
      feedback_chars: 300
      max_retries: 1
  gate: {operator: hillclimb, timeout_s: 600, config: {strict: true}}
  record: {operator: jsonl, timeout_s: 600, config: {}}
  timeout_s: 600
evaluator:
  engine: harbor
  dataset: terminal-bench-2-30-v1
  agent: target.agent:HarborAgent
  split: {train: 0.5, gate: 0.4, sealed: 0.1, seed: 0}
  sampling: static
  tasks_per_round: 10
  anchor: {final: true, every_rounds: 0}
  repetitions: 1
  n_concurrent: 4
  agent_setup_timeout_multiplier: 1
  max_retries: 1
  partial_floor: 0.8
