experiment:
  id: hyperagents-codex-tbench-full
  max_generations: 10
  target_score: null
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: builtin-codex
surface:
  include:
    - target/**
    - operators/**
  exclude: []
operators:
  select: {operator: score_child_prop, config: {seed: 0}}
  rollout: {operator: harbor, timeout_s: 43200, config: {budget_tasks: 50, task_sampling: head, n_concurrent: 5, agent_setup_timeout_multiplier: 1, agent_timeout_multiplier: 1, max_retries: 1, field_limit: 2000}}
  analyze: {operator: trace_browser, timeout_s: 600, config: {max_chars: 30000}}
  mutate: {operator: hyperagents, timeout_s: 21600, config: {runner: harbor, expose_gate_data: false, agent: codex, model: gpt-5.4, environment: docker, image: evolve-mutate-codex:20260904-codex0149, editable_roots: [target, operators], prompt_path: target/prompt.md, skills_dir: target/skills, memory_dir: target/memory, agent_kwargs: {reasoning_effort: high}, max_retries: 1}}
  validate: {operator: hyperagents, timeout_s: 300, config: {}}
  gate: {operator: parent_eligible, config: {}}
  record: {operator: hyperagents, config: {}}
  timeout_s: 600
execution_runtime:
  backend: docker
  minimum_free_gib: 80
evaluator:
  engine: harbor
  model: gpt-5.4
  dataset: terminal-bench@2.0
  agent: target.agent:HarborAgent
  split:
    train: 0.5617977528089888
    gate: 0.21348314606741572
    sealed: 0.2247191011235955
    seed: 0
  sampling: static
  tasks_per_round: 19
  anchor: {final: true, every_rounds: 0}
  repetitions: 1
  n_concurrent: 5
  agent_setup_timeout_multiplier: 1
  agent_timeout_multiplier: 1
  max_retries: 1
  benchmark_timeout_is_zero: true
  partial_floor: 0.8
