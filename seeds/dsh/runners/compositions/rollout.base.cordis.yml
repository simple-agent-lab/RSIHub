# Frozen Harbor rollout overlay — applied as DeepSeekHarness patches= on top of
# profile sdk-minimal. Candidates cannot edit this file.
#
# Keeps the Harbor seams outside the evolvable surface:
#   1. jsonrpc-server (already in sdk-minimal)
#   2. pinned model (SDK initialize + llm-deepseek below)
#   3. bash → docker exec into the task container (terminal-bash)
#   4. session persistence under the isolated dsh_home (sdk-minimal default)
#
# The candidate profile is NOT included from checkout/target/ (that breaks
# Node package resolution). The rollout driver writes it as a second --patch
# under dsh_home after rewriting ./plugins/* to absolute paths.
#
# Runtime variables (injected by DshAgent / rollout_driver):
#   DSH_CONTAINER / DSH_CONTAINER_CWD / DSH_DOCKER_BIN / DSH_MODEL
#
# DSH_DOCKER_BIN is required: DshAgent and rollout_driver resolve it via
# DSH_DOCKER_BIN (if executable) or PATH (shutil.which / command -v). Do not
# fall back to /usr/bin/docker — that path is often missing on Homebrew Mac
# (/opt/homebrew/bin/docker) and surfaces as "PTY shell exited during startup".

# Route shell-backed tools into the Harbor task container.
# Never pass `docker exec -t`: headless Harbor hosts have no TTY, and allocating
# a container PTY makes the bash backend exit at startup under node-pty
# ("PTY shell exited during startup"). Keep `docker exec -i` (stdin only, no
# `-t`) so the host PTY (node-pty) can drive the shell.
# Trailing bash `-i` is required: @deepseek-ai/dsh-terminal-bash readiness waits
# for interactive PS1=`dsh> ` + PROMPT_COMMAND OSC `133;D;` markers
# (DEFAULT_BASH_ARGS include `-i`). Dropping `-i` to "fix" PTY startup yields
# PERSISTENT_BASH_TIMEOUT (no prompts) instead. Doctor
# (`evaluator/doctor_pty_probe.sh`) must match this argv.
- id: terminal-bash
  config:
    backendType: shell
    shellPath: !!js process.env.DSH_DOCKER_BIN
    shellArgs:
      - exec
      - -i
      - -e
      - PS1
      - -e
      - PROMPT_COMMAND
      - -e
      - TERM
      - -e
      - PAGER
      - -e
      - GIT_PAGER
      - -w
      - !!js process.env.DSH_CONTAINER_CWD ?? '/app'
      - !!js process.env.DSH_CONTAINER
      - /bin/bash
      - --noprofile
      - --norc
      - -i
    idleSilenceMs: 500
    handoffGraceMs: 250
    timeoutMs: 300000

# Prefer the evaluator-pinned model id when the adapter exports DSH_MODEL.
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 600000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)
