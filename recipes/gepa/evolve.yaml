experiment:
  id: gepa
  max_generations: 20
  target_score: null
  budget_usd: 150
  children_per_gen: 1
  mode: driver
  seed: 0
target:
  seed: builtin-codex
surface:
  include:
    - target/**
  exclude: []
operators:
  select: {operator: pareto, timeout_s: 600, config: {seed: 0}}
  rollout: {operator: harbor, timeout_s: 3600, config: {budget_tasks: 10, task_sampling: generation_shuffle, n_concurrent: 4, agent_setup_timeout_multiplier: 1, max_retries: 1}}
  analyze:
    operator: gepa
    timeout_s: 600
    config:
      components:
        system_prompt: target/prompt.md
        task_execution_skill: target/skills/task-execution
      max_cases: 10
      field_limit: 4000
  mutate:
    operator: gepa
    timeout_s: 3600
    config:
      expose_gate_data: false
      runner: harbor
      agent: codex
      model: gpt-5.4
      environment: docker
      image: evolve-mutate-codex:20260818-codex0146
      agent_kwargs: {reasoning_effort: xhigh}
      editable_roots: [target]
      components:
        system_prompt: target/prompt.md
        task_execution_skill: target/skills/task-execution
      component_strategy: round_robin
      max_examples: 10
      max_retries: 1
  validate: {operator: minibatch_improvement, timeout_s: 3600, config: {criterion: strict, n_concurrent: 4, agent_setup_timeout_multiplier: 1, max_retries: 1}}
  gate: {operator: parent_eligible, timeout_s: 600, config: {}}
  record: {operator: gepa, timeout_s: 600, config: {}}
  timeout_s: 600
evaluator:
  engine: harbor
  dataset: terminal-bench-2-30-v1
  agent: target.agent:HarborAgent
  split: {train: 0.5, gate: 0.4, sealed: 0.1, seed: 0}
  sampling: static
  tasks_per_round: 10
  anchor: {final: true, every_rounds: 0}
  repetitions: 1
  n_concurrent: 4
  agent_setup_timeout_multiplier: 1
  max_retries: 1
  partial_floor: 0.8
