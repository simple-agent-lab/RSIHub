# Mutation-session overlay — FROZEN. Applied as DeepSeekHarness patches= on
# profile sdk-minimal. dsh runs on the host; cwd = the candidate profile inside
# the child worktree. The task: read failure evidence and improve persona /
# plugins / skills ("dsh writes plugins for itself").
#
# Environment:
#   DSH_MODEL             meta model (default deepseek-v4-pro)
#   DSH_MUTATE_SKILLS_DIR official composition-authoring skills directory
#   DSH_CWD / DSH_HOME    injected by the SDK (cwd + isolated harness home)

- id: sandbox-policy
  config:
    # Confine meta-session filesystem effects to the candidate profile root.
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: system-prompt
  disabled: true

- id: persistent-bash
  disabled: true

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 600000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-pro'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

- insert:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: agent-spine
      name: '@deepseek-ai/dsh-agent-spine-demo'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        persona: |-
          You are the self-improvement engineer of an agent harness. The current working
          directory is your own agent profile: profile.cordis.yml composes you, plugins/
          holds your plugin source files, skills/ holds your skill packages. You will be
          given evaluation evidence (failed task trajectories) and your job is to improve
          this profile so the agent solves more tasks. You may edit the persona, write or
          revise plugins, and add or refine skills. Prototype risky plugin ideas with the
          cordis_define / cordis_run tools before writing files. Keep changes focused and
          justified by the evidence; record your reasoning in EVOLUTION_LOG.md.
        workspaceContext: false
        skills:
          enabled: true
          filesystem:
            includeDefaultRoots: false
            customSkillDirs:
              - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
              - !!js process.env.DSH_MUTATE_SKILLS_DIR ?? ''
        toolBash: false
        toolJobs: false

    - id: mutate-persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      config:
        timeoutMs: 300000

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000

    # Live testbed: define and trial-run plugin drafts in memory before writing.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'
      config:
        vmTimeoutMs: 5000

    - id: tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'
